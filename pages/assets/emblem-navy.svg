<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 22 100 148" width="100" height="148">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e2a8"/><stop offset=".42" stop-color="#d6b062"/>
      <stop offset=".58" stop-color="#b38a3c"/><stop offset="1" stop-color="#ecd290"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e3c62"/><stop offset="1" stop-color="#141c33"/>
    </linearGradient>
    <clipPath id="inside"><path d="M60 166 C55 152 40 128 32 110 L27 107 C23 101 20.5 95 19 88 C17 82 16 77 16 72 A44 44 0 1 1 104 72 C104 77 103 82 101 88 C99.5 95 97 101 93 107 L88 110 C80 128 65 152 60 166 Z"/></clipPath>
    <mask id="cut" maskUnits="userSpaceOnUse">
      <rect width="120" height="172" fill="#fff"/>
      <circle cx="60" cy="70" r="14" fill="#000"/>
      <path d="M60 84 L60 154" stroke="#000" stroke-width="3" stroke-linecap="round"/>
    </mask>
  </defs>
  <g mask="url(#cut)">
    <!-- body -->
    <path d="M60 166 C55 152 40 128 32 110 L27 107 C23 101 20.5 95 19 88 C17 82 16 77 16 72 A44 44 0 1 1 104 72 C104 77 103 82 101 88 C99.5 95 97 101 93 107 L88 110 C80 128 65 152 60 166 Z" fill="url(#body)"/>
    <!-- gold double outline, drawn as true inner offsets of the silhouette -->
    <g clip-path="url(#inside)" fill="none" stroke-linejoin="round">
      <path d="M60 166 C55 152 40 128 32 110 L27 107 C23 101 20.5 95 19 88 C17 82 16 77 16 72 A44 44 0 1 1 104 72 C104 77 103 82 101 88 C99.5 95 97 101 93 107 L88 110 C80 128 65 152 60 166 Z" stroke="url(#gold)" stroke-width="5"/>
      <path d="M60 166 C55 152 40 128 32 110 L27 107 C23 101 20.5 95 19 88 C17 82 16 77 16 72 A44 44 0 1 1 104 72 C104 77 103 82 101 88 C99.5 95 97 101 93 107 L88 110 C80 128 65 152 60 166 Z" stroke="url(#gold)" stroke-width="15"/>
      <path d="M60 166 C55 152 40 128 32 110 L27 107 C23 101 20.5 95 19 88 C17 82 16 77 16 72 A44 44 0 1 1 104 72 C104 77 103 82 101 88 C99.5 95 97 101 93 107 L88 110 C80 128 65 152 60 166 Z" stroke="url(#body)" stroke-width="12.4"/>
    </g>
    <!-- engraved lines running down the nib toward its point -->
    <g fill="none" stroke="url(#gold)" stroke-width="1" stroke-linecap="round" opacity=".85">
      <path d="M46 104 L56.5 138"/>
      <path d="M74 104 L63.5 138"/>
    </g>
  </g>
  <!-- the hole: a gold ring round the pin's circle / the nib's breather -->
  <circle cx="60" cy="70" r="14" fill="none" stroke="url(#gold)" stroke-width="2.2"/>
  <circle cx="60" cy="70" r="9.8" fill="none" stroke="url(#gold)" stroke-width=".8" opacity=".85"/>
  <!-- a small diamond crowning the head, and the gold tipping bead at the point -->
  <path d="M60 38 L63 41.5 L60 45 L57 41.5 Z" fill="url(#gold)"/>
  <circle cx="60" cy="163" r="2.6" fill="url(#gold)"/>
</svg>
