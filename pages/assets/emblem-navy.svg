<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 164" width="120" height="164">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e2a8"/><stop offset=".45" stop-color="#d6b062"/>
      <stop offset=".58" stop-color="#b38a3c"/><stop offset="1" stop-color="#ecd290"/>
    </linearGradient>
    <linearGradient id="goldh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b38a3c"/><stop offset=".35" stop-color="#f6e2a8"/>
      <stop offset=".5" stop-color="#e2c27c"/><stop offset="1" stop-color="#a87f34"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e3c62"/><stop offset="1" stop-color="#141c33"/>
    </linearGradient>
    <mask id="cut">
      <rect width="120" height="164" fill="#fff"/>
      <circle cx="60" cy="80" r="5.2" fill="#000"/>
      <path d="M60 85.5 L60 140" stroke="#000" stroke-width="2.2"/>
    </mask>
  </defs>
  <!-- the pin -->
  <path d="M60 160 C46 135 9 104 9 58 A51 51 0 0 1 111 58 C111 104 74 135 60 160 Z" fill="url(#plate)" stroke="url(#gold)" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M60 148 C49 128 16 100 16 58 A44 44 0 0 1 104 58 C104 100 71 128 60 148 Z" fill="none" stroke="url(#gold)" stroke-width="1" stroke-linejoin="round" opacity=".9"/>
  <!-- small diamonds on the rim, like the plates -->
  <g fill="url(#gold)">
    <path d="M60 2.5 L63.5 6 L60 9.5 L56.5 6 Z"/>
    <path d="M6 58 L9.5 54.5 L13 58 L9.5 61.5 Z" transform="translate(-3.5 0)"/>
    <path d="M114 58 L117.5 54.5 L121 58 L117.5 61.5 Z" transform="translate(-3.5 0)"/>
  </g>
  <!-- the fountain-pen nib: its point is the pin's point -->
  <g mask="url(#cut)">
    <path d="M60 145 L41 92 C38.5 85 41 72 48.5 62 L48.5 50 L71.5 50 L71.5 62 C79 72 81.5 85 79 92 Z" fill="url(#goldh)"/>
  </g>
  <path d="M60 145 L41 92 C38.5 85 41 72 48.5 62 L48.5 50 L71.5 50 L71.5 62 C79 72 81.5 85 79 92 Z" fill="none" stroke="#7a5a22" stroke-width=".7" opacity=".7"/>
  <!-- nib shoulders and the pen's grip -->
  <path d="M48.5 62 L71.5 62" stroke="#141c33" stroke-width="1.1" opacity=".55"/>
  <rect x="45.5" y="36" width="29" height="12" rx="1.5" fill="url(#goldh)"/>
  <path d="M45.5 40 H74.5 M45.5 44 H74.5" stroke="#141c33" stroke-width=".9" opacity=".5"/>
  <path d="M49 34 L71 34 L68 22 L52 22 Z" fill="url(#gold)" opacity=".95"/>
  <path d="M60 14 L63 18 L60 22 L57 18 Z" fill="url(#gold)"/>
</svg>
